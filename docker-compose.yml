services:
  postgres:
    image: postgres:16
    container_name: collabspace-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: collabspace
      POSTGRES_PASSWORD: collabspace
      POSTGRES_DB: collabspace
    ports:
      - "5432:5432"
    volumes:
      - collabspace_postgres_data:/var/lib/postgresql/data

volumes:
  collabspace_postgres_data: